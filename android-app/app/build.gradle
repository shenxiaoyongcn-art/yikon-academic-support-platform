plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yikon.pedigree'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yikon.pedigree'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
