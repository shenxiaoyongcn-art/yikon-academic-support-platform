name: Deploy pedigree web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-web/**
      - components/pedigree-workspace.tsx
      - components/pedigree-workspace.module.css
      - data/monogenic-catalog.json
      - data/common-variant-shortcuts.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-pedigree-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pedigree-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pedigree web
        run: pnpm build:pedigree-web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
